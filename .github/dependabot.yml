version: 2
updates:
  # Keep the pinned release action (and other actions) up to date. Dependabot
  # bumps the commit SHA and the trailing "# vX.Y.Z" comment together, so the
  # workflow stays on an immutable ref while updates arrive via reviewable PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image digest in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # onnxruntime ships no cp315 wheels yet, so the image cannot build on 3.15.
    # Drop this once it does.
    ignore:
      - dependency-name: "hi/python"
        versions: [">=3.15"]
